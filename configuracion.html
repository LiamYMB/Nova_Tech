<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Nova-Tech - Configuración del Sistema</title>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top px-3">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-light d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="indexAdmin.html">
                    <img src="img/logo.png" alt="Nova-Tech" width="45" class="bg-white rounded p-1">
                    <span class="fw-bold">Nova-Tech Admin</span>
                </a>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div id="foto"></div>
                <div class="d-none d-sm-block text-end">
                    <h6 class="text-white mb-0" id="bienvenidoUsuario"></h6>
                    <small class="text-secondary">Administrador</small>
                </div>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="cerrarSesion();">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="offcanvas-lg offcanvas-start bg-dark text-white p-3 min-vh-100" tabindex="-1" id="sidebarMenu">
            <div class="offcanvas-header border-bottom border-secondary pb-3 mb-3 d-lg-none">
                <h5 class="offcanvas-title">Menú Nova-Tech</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"></button>
            </div>

            <div class="offcanvas-body d-flex flex-column p-0">
                <small class="text-uppercase text-secondary fw-bold mb-2 px-2">Operaciones</small>
                <ul class="nav nav-pills flex-column mb-4">
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="indexAdmin.html">
                            <i class="bi bi-grid-1x2-fill me-2"></i>Panel Principal (KPIs)
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="inventario.html">
                            <i class="bi bi-box-seam-fill me-2"></i>Inventario
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="rrhh.html">
                            <i class="bi bi-people-fill me-2"></i>Recursos Humanos
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="proveedores.html">
                            <i class="bi bi-truck me-2"></i>Proveedores y Compras
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="resenas.html">
                            <i class="bi bi-star-half me-2"></i>Reseñas de Productos
                        </a>
                    </li>
                </ul>

                <small class="text-uppercase text-secondary fw-bold mb-2 px-2">Administración</small>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="seguridad.html">
                            <i class="bi bi-shield-lock-fill me-2"></i>Seguridad y Auditorías
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link active text-white" href="configuracion.html">
                            <i class="bi bi-gear-fill me-2"></i>Configuración
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="flex-grow-1 p-4">
            <div class="container-fluid">
                <h3 class="mb-4 fw-bold">Configuración del Sistema</h3>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">Datos Generales de la Plataforma</div>
                    <div class="card-body">
                        <form id="formConfiguracion" class="row g-3">
                            <div class="col-md-6">
                                <label for="cfgEmpresa" class="form-label">Nombre de la Tienda</label>
                                <input type="text" class="form-control" id="cfgEmpresa" value="Nova-Tech Electrónica">
                            </div>
                            <div class="col-md-6">
                                <label for="cfgCorreo" class="form-label">Correo de Soporte</label>
                                <input type="email" class="form-control" id="cfgCorreo" value="soporte@novatech.com">
                            </div>
                            <div class="col-md-4">
                                <label for="cfgTelefono" class="form-label">Teléfono de Contacto</label>
                                <input type="text" class="form-control" id="cfgTelefono" value="477-800-9000">
                            </div>
                            <div class="col-md-4">
                                <label for="cfgMoneda" class="form-label">Moneda Principal</label>
                                <select class="form-select" id="cfgMoneda">
                                    <option value="MXN" selected>MXN - Peso Mexicano ($)</option>
                                    <option value="USD">USD - Dólar Estadounidense ($)</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="cfgIva" class="form-label">Porcentaje de IVA (%)</label>
                                <input type="number" class="form-control" id="cfgIva" value="16">
                            </div>
                            <div class="col-12">
                                <button type="button" class="btn btn-primary" onclick="guardarConfiguracion();">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/configuracion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
