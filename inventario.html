<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo_paneles.css">
    <title>Nova-Tech - Inventario</title>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top px-3">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-light d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="indexAdmin.html">
                    <img src="img/logo.png" alt="Nova-Tech" width="45" class="bg-white rounded p-1">
                    <span class="fw-bold">Nova-Tech Admin</span>
                </a>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div id="foto"></div>
                <div class="d-none d-sm-block text-end">
                    <h6 class="text-white mb-0" id="bienvenidoUsuario"></h6>
                    <small class="text-secondary">Administrador</small>
                </div>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="cerrarSesion();">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="offcanvas-lg offcanvas-start bg-dark text-white p-3 min-vh-100" tabindex="-1" id="sidebarMenu" style="width: 280px; flex: 0 0 280px;">
            <div class="offcanvas-header border-bottom border-secondary pb-3 mb-3 d-lg-none">
                <h5 class="offcanvas-title">Menú Nova-Tech</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"></button>
            </div>

            <div class="offcanvas-body d-flex flex-column p-0">
                <small class="text-uppercase text-secondary fw-bold mb-2 px-2">Operaciones</small>
                <ul class="nav nav-pills flex-column mb-4">
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="indexAdmin.html">
                            <i class="bi bi-grid-1x2-fill me-2"></i>Panel Principal (KPIs)
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link active text-white" href="inventario.html">
                            <i class="bi bi-box-seam-fill me-2"></i>Inventario
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="rrhh.html">
                            <i class="bi bi-people-fill me-2"></i>Recursos Humanos
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="carritos.html">
                            <i class="bi bi-cart3 me-2"></i>Carritos de Venta
                        </a>
                    </li>
                </ul>

                <small class="text-uppercase text-secondary fw-bold mb-2 px-2">Administración</small>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item mb-1">
                        <a class="nav-link text-white" href="configuracion.html">
                            <i class="bi bi-gear-fill me-2"></i>Configuración
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="flex-grow-1 p-4">
            <div class="container-fluid">
                <h3 class="mb-4 fw-bold">Gestión de Inventario</h3>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold">Agregar Producto</div>
                    <div class="card-body">
                        <form id="formProducto" class="row g-3 align-items-end">
                            <div class="col-md-5">
                                <label for="nombreProducto" class="form-label">Nombre del producto</label>
                                <input type="text" class="form-control" id="nombreProducto" placeholder="Ej. Teclado Mecánico RGB" oninput="validarProducto();">
                            </div>
                            <div class="col-md-4">
                                <label for="precioProducto" class="form-label">Precio ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="precioProducto" placeholder="0.00" oninput="validarProducto();">
                            </div>
                            <div class="col-md-3">
                                <label for="imagenProducto" class="form-label">Imagen del producto</label>
                                <input type="file" class="form-control" id="imagenProducto" accept="image/*" onchange="previsualizarImagen(); validarProducto();">
                                <img id="vistaPreviaProducto" class="imagen-producto mt-2" alt="Vista previa de la imagen seleccionada" hidden>
                            </div>
                            <div class="col-md-3 d-grid">
                                <button type="button" id="btnGuardar" class="btn btn-primary" onclick="guardarProducto();" disabled>Guardar Producto</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold">Catálogo en Inventario</h5>
                        <span class="badge bg-secondary" id="contadorProductos">0 productos</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped mb-0 align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Imagen</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Actualizar</th>
                                        <th>Eliminar</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
