
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

    <title>Nova-Tech</title>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <header class="text-center">

                <img src="img/logo.png" width="280">



                

            </header>

            <section aria-labelledby="titulo-login" class="text-center">

                <h2 id="titulo-login" class="fw-bold fs-5 mb-1 m-1">
                    Bienvenido a Nova-Tech
                </h2>

                <p class="text-secondary small mb-4">
                    Tu tienda de electronica de confianza
                </p>

            </section>

            <form id="loginForm">

            
                <fieldset class="mb-3">

                    <label for="usuario" class="form-label">
                        Usuario
                    </label>

                    <span class="input-group-custom">
                        

                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            placeholder="Ingresa tu usuario"
                            value="johnd"
                            required
                        >
                    </span>

                </fieldset>

                
                <fieldset class="mb-3">

                    <label for="password" class="form-label">
                        Contraseña 
                    </label>
                    

                    <span class="input-group-custom">
                        

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            value="m38rmF$"
                            required
                        >

                        
                    </span>

                    

                </fieldset>

                    <section class="recordar mb-4">
                        <label class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="recordar"
                            >
                            <span class="form-check-label">
                                Recordarme
                            </span>
                        </label>
                    </section>
               
                
                

                
                <button type="button" onclick="iniciarSesion()" class="btn btn-login w-100">
                    Iniciar sesión
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>
                <h6 id="errorLogin"></h6>

                </section>
            </form>


        </section>

    </main>
    <script src="js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    

</body>
</html>
